{{define "title"}}Book Appointment — Chikitsalaya{{end}}
{{define "content"}}
<h1>Book Appointment</h1>
<p>Patient: <strong>{{.Patient.FirstName}} {{.Patient.LastName}}</strong> ({{.Patient.MRN}})
   &mdash; <a href="/appointments/new">change patient</a></p>

{{if .Error}}
<div role="alert" data-variant="error">{{.Error}}</div>
{{end}}

<article class="card">
<form method="post" action="/appointments" id="booking-form">
    <input type="hidden" name="patient_id" value="{{.Patient.ID}}">

    <div class="hstack">
        <div data-field>
            <label>Practitioner</label>
            <select name="practitioner_id" aria-label="Practitioner" required
                    hx-get="/appointments/slots" hx-include="#booking-form" hx-target="#slot-grid"
                    hx-trigger="{{if .PractitionerID}}load, {{end}}change">
                <option value="">Select a practitioner</option>
                {{range .Practitioners}}
                <option value="{{.ID}}" {{if eq $.PractitionerID .ID}}selected{{end}}>{{.FullName}}</option>
                {{end}}
            </select>
        </div>
        <div data-field>
            <label>Date</label>
            <div class="availability-date" data-availability-widget
                 data-weekdays-endpoint="/appointments/available-weekdays" data-practitioner-select="practitioner_id">
                <button type="button" class="outline availability-date-trigger" data-availability-trigger disabled>Select a practitioner first</button>
                <input type="hidden" name="date" value="{{.Date}}" data-availability-value
                       hx-get="/appointments/slots" hx-include="#booking-form" hx-target="#slot-grid" hx-trigger="change">
                <div class="availability-calendar" data-availability-calendar hidden></div>
            </div>
        </div>
    </div>

    <div class="hstack">
        <div data-field>
            <label>Appointment type</label>
            <select name="appointment_type" aria-label="Appointment type">
                <option value="New Consultation">New Consultation</option>
                <option value="Followup">Followup</option>
            </select>
        </div>
    </div>

    <label data-field>
        Reason for visit
        <textarea name="reason_for_visit"></textarea>
    </label>

    <div data-field>
        <label>Available slots</label>
        <div id="slot-grid">
            <p>Choose a practitioner and date to see available slots.</p>
        </div>
    </div>
</form>
</article>
{{end}}
