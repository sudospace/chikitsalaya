{{define "title"}}Patients — Chikitsalaya{{end}}
{{define "content"}}
<div class="page-header">
    <h1>Patients</h1>
    <a href="/patients/new" class="button">New Patient</a>
</div>

<article class="card">
    <input type="search" name="q" value="{{.Query}}" placeholder="Search by name, phone, or MRN..."
           aria-label="Search patients"
           hx-get="/patients/search" hx-trigger="keyup changed delay:300ms, search"
           hx-target="#patient-rows" hx-swap="innerHTML">

    <div class="record-list-header mt-3">
        <span class="record-row-main">Patient</span>
        <span class="record-row-meta">Sex, phone, blood group</span>
    </div>
    <div class="record-list" id="patient-rows">
        {{template "patient_rows" .Patients}}
    </div>
</article>
{{end}}
