{{define "title"}}{{if .Unit.ID}}Edit Service Unit{{else}}New Service Unit{{end}} — Chikitsalaya{{end}}
{{define "content"}}
<h1>{{if .Unit.ID}}Edit Service Unit{{else}}New Service Unit{{end}}</h1>

{{if .Error}}
<div role="alert" data-variant="error">{{.Error}}</div>
{{end}}

<article class="card">
<form method="post" action="{{.Action}}">
    <div class="hstack">
        <label data-field>
            Name
            <input type="text" name="name" value="{{.Unit.Name}}" required placeholder="e.g. Consultation Room 1">
        </label>
        <div data-field>
            <label>Type</label>
            {{$currentType := .Unit.UnitType}}
            <select name="unit_type" aria-label="Unit type" required>
                <option value="consultation_room" {{if eq $currentType "consultation_room"}}selected{{end}}>Consultation room</option>
                <option value="procedure_room" {{if eq $currentType "procedure_room"}}selected{{end}}>Procedure room</option>
                <option value="lab" {{if eq $currentType "lab"}}selected{{end}}>Lab</option>
            </select>
        </div>
    </div>

    <label data-field>
        <input type="checkbox" name="is_active" {{if or (not .Unit.ID) .Unit.IsActive}}checked{{end}}>
        Active
    </label>

    <menu class="buttons">
        <li><button type="submit">Save</button></li>
        <li><a href="/admin/service-units" class="button outline">Cancel</a></li>
    </menu>
</form>
</article>
{{end}}
