{{define "title"}}Service Units — Chikitsalaya{{end}}
{{define "content"}}
<div class="page-header">
    <h1>Service Units</h1>
    <a href="/admin/service-units/new" class="button">New Service Unit</a>
</div>

<article class="card">
    <div class="record-list-header">
        <span class="record-row-main">Service unit</span>
        <span class="record-row-meta">Type &amp; status</span>
    </div>
    <div class="record-list">
        {{range .}}
        <div class="record-row">
            <div class="record-row-main">
                <strong>{{.Name}}</strong>
            </div>
            <div class="record-row-meta">
                <span>{{.UnitType}}</span>
                {{if .IsActive}}<span class="badge badge-success">Active</span>{{else}}<span class="badge badge-muted">Inactive</span>{{end}}
            </div>
            <div class="row-actions">
                <a href="/admin/service-units/{{.ID}}/edit" class="button small outline">Edit</a>
            </div>
        </div>
        {{else}}
        <p class="record-empty">No service units yet.</p>
        {{end}}
    </div>
</article>
{{end}}
