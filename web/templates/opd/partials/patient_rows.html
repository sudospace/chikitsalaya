{{define "patient_rows"}}
{{range .}}
<div class="record-row">
    <div class="record-row-main">
        <a href="/patients/{{.ID}}"><strong>{{.MRN}}</strong></a>
        <span>{{.FirstName}} {{.LastName}}</span>
    </div>
    <div class="record-row-meta">
        {{if .Sex}}<span>{{.Sex}}</span>{{end}}
        {{if .Phone}}<span>{{.Phone}}</span>{{end}}
        {{if .BloodGroup}}<span>{{.BloodGroup}}</span>{{end}}
    </div>
</div>
{{else}}
<p class="record-empty">No patients found.</p>
{{end}}
{{end}}
